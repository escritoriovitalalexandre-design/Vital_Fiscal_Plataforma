    // Prior V14 had a single global Caixa record. Never silently discard/migrate it.
    const legacyCaixa = (data || []).find(row => row.entity_type==='caixa' && row.entity_key==='global');
    if(legacyCaixa) {
      localStorage.setItem('vfCaixaLegacyCloudExists','1');
      if(!localStorage.getItem('vfCaixaLegacyCloudBackup'))localStorage.setItem('vfCaixaLegacyCloudBackup', JSON.stringify(legacyCaixa.value));
    }else localStorage.removeItem('vfCaixaLegacyCloudExists');
    const caixaRaw = vfComposeCaixa(grouped.caixa_empresa,grouped.caixa_config);
    if (!grouped.caixa_empresa.length && localStorage.getItem('vitalCaixaFiscalV07') && localStorage.getItem('vitalCaixaFiscalV07') !== 'null') {
      // Never import old local-only test records into cloud automatically.
      const previous = localStorage.getItem('vitalCaixaFiscalV07');
      if (!localStorage.getItem('vfCaixaLocalBackupBeforeCloud')) localStorage.setItem('vfCaixaLocalBackupBeforeCloud', previous);
    }
    localStorage.setItem('vitalFiscalData', fiscalRaw);
    localStorage.setItem('vitalFechamentoClientesProvisorios', JSON.stringify(grouped.client));
    localStorage.setItem('vitalFechamentoTeste', closingRaw);
    localStorage.setItem('vitalFiscalClosingDrafts', draftRaw);
    localStorage.setItem('vitalCaixaFiscalV07', caixaRaw);
    localStorage.setItem('vitalFechamentoBloqueios', JSON.stringify((locks || []).map(lock => ({
      key: lock.lock_key,
      clientCode: lock.client_code,
      competence: lock.competence,
      userId: lock.user_id,
      userName: lock.user_name,
      startedAt: lock.acquired_at,
      expiresAt: lock.expires_at
    }))));
    snapshots.set('vitalFiscalData', fiscalRaw);
    snapshots.set('vitalFechamentoTeste', closingRaw);
    snapshots.set('vitalFiscalClosingDrafts', draftRaw);
    snapshots.set('vitalCaixaFiscalV07', caixaRaw);
    applyingRemote = false;
  }

  function entityGroups(storageKey, raw) {
    const parsed = safeJson(raw) ?? (storageKey === 'vitalFiscalData' ? {} : []);
    return Object.entries(entityDefinitions)
      .filter(([, definition]) => definition.storageKey === storageKey)
      .map(([type, definition]) => ({type, definition, items: definition.list(parsed)}));
  }

  function mapItems(items, identity) {
    const result = new Map();
    for (const item of items || []) {
      const key = identity(item);
      if (key) result.set(key, item);
    }
    return result;
  }

  function replaceEntityInRaw(raw, entityType, entityKey, value, deleted = false) {
    if (entityType === 'caixa_empresa' || entityType === 'caixa_config') return vfMergeCaixa(raw,entityType,entityKey,value,deleted);
    const definition = entityDefinitions[entityType];
    const storageKey = definition.storageKey;
    const parsed = safeJson(raw) ?? (storageKey === 'vitalFiscalData' ? {} : []);
    const list = definition.list(parsed);
    const nextList = deleted
      ? list.filter(item => definition.identity(item) !== entityKey)
      : [value, ...list.filter(item => definition.identity(item) !== entityKey)];
    return JSON.stringify(storageKey === 'vitalFiscalData'
      ? {...parsed, [entityType === 'client' ? 'clients' : 'assessments']: nextList}
      : nextList);
  }

  // Safe-guard: Caixa is a single global document in V14; never overwrite another user's changes.
  function backupPendingCaixa(raw, reason) {
    const key = `vfCaixaConflito_${reason}_${Date.now()}`;
    try { localStorage.setItem(key, raw ?? 'null'); return key; }
    catch (error) { console.error('Não foi possível preservar a alteração conflitante do Caixa:', error); return null; }
  }

  async function resolveEntityConflict(context) {
    if (!context) return false;
    if (context.entityType === 'caixa_empresa' || context.entityType === 'caixa_config') {
      const unsavedRaw = localStorage.getItem(context.storageKey);
      const backupKey = backupPendingCaixa(unsavedRaw, 'gravacao');
      if (!backupKey) {
        localStorage.setItem('vf14CaixaImportApproved', '0');
        setStatus('', 'Caixa bloqueado por conflito', 'Não foi possível fazer o backup local. Não continue lançando.');
        toast('Conflito no Caixa. Faça backup manual antes de continuar.', true);
        return false;
      }
      const {data, error} = await client.from('app_entities')
        .select('entity_type,entity_key,value,revision,updated_at,updated_by')
        .eq('entity_type', context.entityType)
        .eq('entity_key', context.entityKey)
        .maybeSingle();
      if (error) throw error;
      const rawServer = vfMergeCaixa(localStorage.getItem(context.storageKey), context.entityType, context.entityKey, data?.value, !data);
      const revisionKey = `${context.entityType}|${context.entityKey}`;
      if (data) revisions.set(revisionKey, Number(data.revision));
      else revisions.delete(revisionKey);
      snapshots.set(context.storageKey, vfMergeCaixa(snapshots.get(context.storageKey),context.entityType, context.entityKey, data?.value, !data));
      applyingRemote = true;
      localStorage.setItem(context.storageKey, rawServer);
      applyingRemote = false;
      window.dispatchEvent(new CustomEvent('vf:remote-update', {detail: {key:context.storageKey,entityType:context.entityType,entityKey:context.entityKey}}));
      setStatus('', 'Conflito de Caixa bloqueado', 'A cópia mais recente do servidor foi preservada.');
      toast('Conflito no Caixa: lançamento não salvo. Cópia local preservada para conferência.', true);
      alert('ATENÇÃO: dois usuários alteraram o Caixa ao mesmo tempo. Sua edição NÃO foi gravada nem substituiu dados de outra pessoa. Uma cópia local foi preservada para conferência. Não repita o lançamento sem conciliar as informações.');
      return false;
    }
    const {data, error} = await client.from('app_entities')
      .select('entity_type,entity_key,value,revision,updated_at,updated_by')
      .eq('entity_type', context.entityType)
      .eq('entity_key', context.entityKey)
      .maybeSingle();
    if (error) throw error;
    const keepLocal = window.confirm('Este registro foi alterado por outro usuário antes da sua gravação.\n\nClique em OK para manter e salvar a sua versão, ou em Cancelar para carregar a versão mais recente do servidor.');
    const revisionKey = `${context.entityType}|${context.entityKey}`;
    const snapshotRaw = snapshots.get(context.storageKey);
    const serverRaw = replaceEntityInRaw(snapshotRaw, context.entityType, context.entityKey, data?.value, !data);
    if (data) revisions.set(revisionKey, Number(data.revision));
    else revisions.delete(revisionKey);
    snapshots.set(context.storageKey, serverRaw);
    if (keepLocal) {
      setStatus('saving', 'Atualizando sua versão...', 'A versão mais recente foi conferida antes de salvar.');
      return true;
    }
    applyingRemote = true;
    localStorage.setItem(context.storageKey, serverRaw);
    if (context.entityType === 'client') {
      const fiscal = safeJson(serverRaw) || {};
      localStorage.setItem('vitalFechamentoClientesProvisorios', JSON.stringify(fiscal.clients || []));
    }
    applyingRemote = false;
    setStatus('online', 'Conectado ao Supabase', 'A versão mais recente do servidor foi carregada.');
    toast('Versão mais recente do servidor carregada.');
    return false;
  }

  async function saveKey(key, raw, showToast = true) {
    if (saving || applyingRemote) return;
    saving = true;
    let conflictContext = null;
    let retryAfterConflict = false;
    setStatus('saving', 'Salvando no servidor...', 'Não feche esta tela.');
    try {
      const previousRaw = snapshots.get(key);
      for (const currentGroup of entityGroups(key, raw)) {
        const previousGroup = entityGroups(key, previousRaw).find(group => group.type === currentGroup.type);
        const current = mapItems(currentGroup.items, currentGroup.definition.identity);
        const previous = mapItems(previousGroup?.items || [], currentGroup.definition.identity);

        for (const [entityKey, value] of current) {
          if (JSON.stringify(previous.get(entityKey)) === JSON.stringify(value)) continue;
          const revisionKey = `${currentGroup.type}|${entityKey}`;
          if(currentGroup.type==='caixa_empresa' && !window.vfCaixaHasLock(entityKey)) {
            backupPendingCaixa(raw, 'sem_bloqueio');
            throw Error('CAIXA_SEM_BLOQUEIO: selecione e bloqueie a empresa antes de salvar');
          }
          conflictContext = {storageKey:key, entityType:currentGroup.type, entityKey, value, operation:'save'};
          const {data, error} = await client.rpc('save_app_entity', {
            p_entity_type: currentGroup.type,
            p_entity_key: entityKey,
            p_value: value,
            p_expected_revision: revisions.get(revisionKey) || 0
          });
          if (error) throw error;
          const row = Array.isArray(data) ? data[0] : data;
          revisions.set(revisionKey, Number(row.revision));
        }

        for (const entityKey of previous.keys()) {
          if (current.has(entityKey)) continue;
          if(currentGroup.type==='caixa_empresa'){
            throw Error('CAIXA_EXCLUSAO_BLOQUEADA: exclusão de empresa exige procedimento específico');
          }
          const revisionKey = `${currentGroup.type}|${entityKey}`;
          conflictContext = {storageKey:key, entityType:currentGroup.type, entityKey, operation:'delete'};
          const {error} = await client.rpc('delete_app_entity', {
            p_entity_type: currentGroup.type,
            p_entity_key: entityKey,
            p_expected_revision: revisions.get(revisionKey) || 0
          });
          if (error) throw error;
          revisions.delete(revisionKey);
        }
      }
      snapshots.set(key, raw);
      const time = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      setStatus('online', 'Conectado ao Supabase', `Salvo às ${time} por ${profile.full_name}.`);
      if (showToast) toast('Salvo com sucesso no servidor.');
    } catch (error) {
      console.error(error);
      const conflict = String(error.message || '').includes('CONFLITO_DE_VERSAO');
      if (conflict) {
        try { retryAfterConflict = await resolveEntityConflict(conflictContext); }
        catch (resolutionError) {
          console.error('Falha ao resolver conflito:', resolutionError);
          setStatus('', 'Conflito no mesmo registro', 'Não foi possível consultar a versão mais recente.');
          toast('Não foi possível resolver o conflito. Tente novamente.', true);
        }
      } else {
        setStatus('', 'Erro ao salvar no servidor', 'Verifique sua internet e tente novamente.');
        toast('Não foi possível salvar no servidor.', true);
      }
    } finally {
      saving = false;
      if (retryAfterConflict) setTimeout(() => saveKey(key, localStorage.getItem(key), showToast), 50);
    }
  }

  function watchLocalChanges() {
    setInterval(() => {
      if (saving || applyingRemote) return;
      for (const key of DATA_KEYS) {
        // Caixa V14: never write the experimental module to production without explicit opt-in.
        if (key === 'vitalCaixaFiscalV07' && localStorage.getItem('vf14CaixaImportApproved') !== '1') continue;
        const raw = localStorage.getItem(key);
        if (raw !== snapshots.get(key)) {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => saveKey(key, raw), 500);
          break;
        }
      }
      syncLockRequests();
    }, 600);
    setInterval(renewOwnedLocks, 45000);
  }

  function currentLocalLocks() {
    try { return JSON.parse(localStorage.getItem('vitalFechamentoBloqueios') || '[]'); }
    catch { return []; }
  }

  async function syncLockRequests() {
    if (lockSyncing || applyingRemote || !profile) return;
    lockSyncing = true;
    try {
      const local = currentLocalLocks();
      const requested = new Map(local.filter(lock => lock.userId === profile.id).map(lock => [lock.key, lock]));
      for (const [key, lock] of requested) {
        if (ownedLocks.has(key)) continue;
        const result = await window.vfAcquireLock(lock.clientCode, lock.competence);
        if (result?.acquired) {
          ownedLocks.add(key);
          continue;
        }
        applyingRemote = true;
        localStorage.setItem('vitalFechamentoBloqueios', JSON.stringify(local.filter(item => item.key !== key)));
        applyingRemote = false;
        const frameWindow = document.getElementById('vfClosingFrame')?.contentWindow;
        frameWindow?.openModal?.('Fechamento em processo', `Esta empresa já está sendo realizada por ${result?.owner_name || 'outro usuário'}.`, 'Selecione outra empresa ou aguarde a liberação.');
        frameWindow?.clearForm?.(false);
        toast(`Empresa em uso por ${result?.owner_name || 'outro usuário'}.`, true);
      }
      for (const key of [...ownedLocks]) {
        if (requested.has(key)) continue;
        await window.vfReleaseLock(key);
        ownedLocks.delete(key);
      }
    } catch (error) {
      console.error('Sincronização de bloqueio:', error);
      toast('Não foi possível confirmar o bloqueio da empresa.', true);
    } finally {
      lockSyncing = false;
    }
  }

  async function renewOwnedLocks() {
    if(vfCaixaLock){
      try{ if(!await window.vfRenewLock(vfCaixaLock.lockKey)){
        vfCaixaLock=null;
        window.dispatchEvent(new CustomEvent('vf:caixa-lock-lost'));
      }}catch(err){vfCaixaLock=null;window.dispatchEvent(new CustomEvent('vf:caixa-lock-lost'));console.error(err)}
    }
    for (const key of [...ownedLocks]) {
      try {
        if (!await window.vfRenewLock(key)) ownedLocks.delete(key);
      } catch (error) {
        console.error('Renovação de bloqueio:', error);
      }
    }
  }

  function subscribeRealtime() {
    client.channel('vital-fiscal-entities')
      .on('postgres_changes', {event:'*', schema:'public', table:'app_entities'}, payload => {
        const row = payload.new?.entity_type ? payload.new : payload.old;
        if (!row?.entity_type || !entityDefinitions[row.entity_type]) return;
        const revisionKey = `${row.entity_type}|${row.entity_key}`;
        if (payload.new?.updated_by === profile.id) return;
        const definition = entityDefinitions[row.entity_type];
        const storageKey = definition.storageKey;
        const currentRaw = localStorage.getItem(storageKey);
        const snapshotRaw = snapshots.get(storageKey);
        const emptyValue = storageKey === 'vitalFiscalData' ? {} : [];
        const parsed = safeJson(currentRaw) ?? emptyValue;
        const snapshotParsed = safeJson(snapshotRaw) ?? emptyValue;
        const list = definition.list(parsed);
        const snapshotList = definition.list(snapshotParsed);
        const localEntity = list.find(item => definition.identity(item) === row.entity_key);
        const snapshotEntity = snapshotList.find(item => definition.identity(item) === row.entity_key);
        const sameEntityIsDirty = JSON.stringify(localEntity) !== JSON.stringify(snapshotEntity);
        if ((row.entity_type === 'caixa_empresa' || row.entity_type === 'caixa_config') && sameEntityIsDirty) {
          const backupKey = backupPendingCaixa(currentRaw, 'tempo_real');
          if (!backupKey) {
            localStorage.setItem('vf14CaixaImportApproved', '0');
            setStatus('', 'Caixa bloqueado por conflito', 'Falha ao preservar sua edição local.');
            toast('Caixa: erro de backup durante atualização de outro usuário.', true);
            return;
          }
          alert('ATENÇÃO: foi recebida uma atualização de outro usuário. Sua edição local do Caixa não foi enviada para sobrescrever o servidor; uma cópia foi preservada para conciliação.');
        }
        const keepLocalVersion = !['caixa_empresa','caixa_config'].includes(row.entity_type) && sameEntityIsDirty && window.confirm('Outro usuário alterou este mesmo registro enquanto você trabalhava.\n\nClique em OK para manter e salvar a sua versão, ou em Cancelar para carregar a versão recebida do servidor.');
        const mergeRemote = sourceList => payload.eventType === 'DELETE'
          ? sourceList.filter(item => definition.identity(item) !== row.entity_key)
          : [payload.new.value, ...sourceList.filter(item => definition.identity(item) !== row.entity_key)];
        const nextList = keepLocalVersion ? list : mergeRemote(list);
        const nextSnapshotList = mergeRemote(snapshotList);
        const listField = row.entity_type === 'client' ? 'clients' : 'assessments';
        const isCaixa=row.entity_type==='caixa_empresa'||row.entity_type==='caixa_config';
        const next = isCaixa ? safeJson(vfMergeCaixa(currentRaw,row.entity_type,row.entity_key,payload.new?.value,payload.eventType==='DELETE')) : storageKey === 'vitalFiscalData' ? {...parsed, [listField]: nextList} : nextList;
        const nextSnapshot = isCaixa ? safeJson(vfMergeCaixa(snapshotRaw,row.entity_type,row.entity_key,payload.new?.value,payload.eventType==='DELETE')) : storageKey === 'vitalFiscalData' ? {...snapshotParsed, [listField]: nextSnapshotList} : nextSnapshotList;
        const nextRaw = JSON.stringify(next);
        const nextSnapshotRaw = JSON.stringify(nextSnapshot);
        applyingRemote = true;
        localStorage.setItem(storageKey, nextRaw);
        if (row.entity_type === 'client') localStorage.setItem('vitalFechamentoClientesProvisorios', JSON.stringify(nextList));
        if (payload.eventType === 'DELETE') revisions.delete(revisionKey);
        else revisions.set(revisionKey, Number(payload.new.revision));
        snapshots.set(storageKey, nextSnapshotRaw);
        applyingRemote = false;
        setStatus('online', 'Conectado ao Supabase', `Atualização recebida de outro usuário às ${new Date().toLocaleTimeString('pt-BR')}.`);
        window.dispatchEvent(new CustomEvent('vf:remote-update', {detail: {key: storageKey, entityType: row.entity_type, entityKey: row.entity_key}}));
        toast(sameEntityIsDirty ? (keepLocalVersion ? 'Sua versão foi mantida e será salva sobre a versão recebida.' : 'A versão mais recente do servidor foi carregada.') : 'Alteração de outro usuário recebida sem interromper seu trabalho.', sameEntityIsDirty);
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'app_locks'}, async () => {
        const {data} = await client.from('app_locks').select('lock_key,client_code,competence,user_id,user_name,acquired_at,expires_at');
        applyingRemote = true;
        localStorage.setItem('vitalFechamentoBloqueios', JSON.stringify((data || []).map(lock => ({key:lock.lock_key,clientCode:lock.client_code,competence:lock.competence,userId:lock.user_id,userName:lock.user_name,startedAt:lock.acquired_at,expiresAt:lock.expires_at}))));
        applyingRemote = false;
      })
      .subscribe(status => {
        if (status === 'SUBSCRIBED') setStatus('online', 'Conectado ao Supabase', `Usuário: ${profile.full_name}.`);
      });
  }

  window.vfAcquireLock = async (clientCode, competence) => {
    const {data, error} = await client.rpc('acquire_app_lock', {
      p_client_code: String(clientCode || ''),
      p_competence: String(competence || ''),
      p_user_name: profile?.full_name || 'Usuário',
      p_ttl_seconds: 120
    });
    if (error) throw error;
    return Array.isArray(data) ? data[0] : data;
  };

  window.vfRenewLock = async lockKey => {
    const {data, error} = await client.rpc('renew_app_lock', {p_lock_key: lockKey, p_ttl_seconds: 120});
    if (error) throw error;
    return data === true;
  };

  window.vfReleaseLock = async lockKey => {
    const {data, error} = await client.rpc('release_app_lock', {p_lock_key: lockKey});
    if (error) throw error;
    return data === true;
  };

  async function enterCloud(session) {
    profile = await getProfile(session.user.id);
    await loadServerState();
    seedLegacySession();
    document.getElementById('vfCloudGate').classList.add('hidden');
    document.getElementById('vfCloudUsers').classList.toggle('hidden', profile.role !== 'admin');
    setStatus('online', 'Conectado ao Supabase', `Usuário: ${profile.full_name}.`);
    subscribeRealtime();
    watchLocalChanges();

    const marker = `${session.user.id}:${session.access_token.slice(-12)}`;
    if (sessionStorage.getItem(BOOT_KEY) !== marker) {
      sessionStorage.setItem(BOOT_KEY, marker);
      location.reload();
    }
  }

  async function login() {
    const loginId = document.getElementById('vfCloudLoginId').value.trim().toLowerCase();
    const email = loginId.includes('@') ? loginId : (LOGIN_EMAILS[loginId] || (/^[a-z0-9._-]{3,30}$/.test(loginId) ? `${loginId}@login.vital-fiscal.local` : ''));
    const password = document.getElementById('vfCloudPassword').value;
    const errorBox = document.getElementById('vfCloudError');
    const button = document.getElementById('vfCloudLogin');
    errorBox.textContent = '';
    if (!email) {
      errorBox.textContent = 'Nome de usuário não cadastrado.';
      return;
    }
    button.disabled = true;
    button.textContent = 'Entrando...';
    const {data, error} = await client.auth.signInWithPassword({email, password});
    button.disabled = false;
    button.textContent = 'Entrar';
    if (error) {
      const detail = error.message || error.code || 'Falha desconhecida';
      errorBox.textContent = `Não foi possível entrar: ${detail}`;
      console.error('Supabase Auth:', error);
      return;
    }
    try { await enterCloud(data.session); }
    catch (e) { errorBox.textContent = e.message || 'Não foi possível acessar o perfil.'; }
  }

  async function adminRequest(payload) {
    const {data: {session}} = await client.auth.getSession();
    if (!session) throw new Error('Sessão encerrada. Entre novamente.');
    const response = await fetch(ADMIN_FUNCTION_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':`Bearer ${session.access_token}`, 'apikey':SUPABASE_ANON_KEY},
      body: JSON.stringify(payload)
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || 'Não foi possível concluir a operação.');
    return result;
  }

  function maskCpf(value) {
    const digits = String(value || '').replace(/\D/g, '').slice(0, 11);
    return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }

  function adminMessage(text, error = false) {
    const box = document.getElementById('vfAdminMessage');
    box.textContent = text;
    box.className = `vfAdminMessage ${error ? 'error' : 'ok'}`;
  }

  async function loadUsers() {
    const {data, error} = await client.from('profiles').select('id,username,full_name,cpf,role,active,created_at').order('full_name');
    if (error) throw error;
    const body = document.getElementById('vfUsersBody');
    body.innerHTML = (data || []).map(user => `<tr><td>${escapeHtml(user.full_name)}</td><td>${escapeHtml(maskCpf(user.cpf))}</td><td>${escapeHtml(user.username)}</td><td>${user.role === 'admin' ? 'Administrador' : 'Usuário'}</td><td class="${user.active ? 'on' : 'off'}">${user.active ? 'Ativo' : 'Desativado'}</td><td><button data-reset="${user.id}">Nova senha</button>${user.id === profile.id ? '' : `<button data-active="${user.id}" data-value="${!user.active}">${user.active ? 'Desativar' : 'Ativar'}</button>`}</td></tr>`).join('');
    body.querySelectorAll('[data-reset]').forEach(button => button.onclick = async () => {
      const password = prompt('Digite a nova senha (mínimo de 8 caracteres):');
      if (!password) return;
      try { await adminRequest({action:'reset_password', id:button.dataset.reset, password}); adminMessage('Senha redefinida com sucesso.'); }
      catch (e) { adminMessage(e.message, true); }
    });
    body.querySelectorAll('[data-active]').forEach(button => button.onclick = async () => {
      try { await adminRequest({action:'set_active', id:button.dataset.active, active:button.dataset.value === 'true'}); adminMessage('Situação do usuário atualizada.'); await loadUsers(); }
      catch (e) { adminMessage(e.message, true); }
    });
  }

  async function openUserAdmin() {
    if (profile?.role !== 'admin') return;
    document.getElementById('vfUserAdmin').classList.remove('hidden');
    adminMessage('Carregando usuários...');
    try { await loadUsers(); adminMessage(''); }
    catch (e) { adminMessage(e.message, true); }
  }

  async function createUser() {
    const button = document.getElementById('vfCreateUser');
    button.disabled = true;
    try {
      await adminRequest({action:'create', full_name:document.getElementById('vfNewFullName').value, cpf:document.getElementById('vfNewCpf').value, username:document.getElementById('vfNewUsername').value, password:document.getElementById('vfNewPassword').value, role:document.getElementById('vfNewRole').value});
      ['vfNewFullName','vfNewCpf','vfNewUsername','vfNewPassword'].forEach(id => document.getElementById(id).value = '');
      adminMessage('Usuário cadastrado com sucesso.');
      await loadUsers();
    } catch (e) { adminMessage(e.message, true); }
    finally { button.disabled = false; }
  }

  function recoveryRequest() {
    const name = prompt('Informe seu nome completo:');
    if (!name) return;
    const cpf = prompt('Informe seu CPF:');
    if (!cpf) return;
    const message = `Olá! Preciso de ajuda com meu acesso à Plataforma Fiscal Vital.\nNome: ${name}\nCPF: ${cpf}\nMotivo: esqueci meu usuário ou senha.`;
    window.open(`https://wa.me/${RECOVERY_WHATSAPP}?text=${encodeURIComponent(message)}`, '_blank', 'noopener');
  }

  async function logout() {
    setStatus('saving', 'Encerrando acesso...', 'Aguarde.');
    try { await client.auth.signOut(); } catch (error) { console.error(error); }
    sessionStorage.removeItem(BOOT_KEY);
    sessionStorage.removeItem(LEGACY_SESSION);
    location.reload();
  }

  async function start() {
    injectUi();
    if (!window.supabase?.createClient) {
      setStatus('', 'Falha ao carregar o Supabase', 'Verifique sua conexão com a internet.');
      document.getElementById('vfCloudError').textContent = 'Não foi possível conectar ao servidor.';
      return;
    }
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.sessionStorage,
        storageKey: 'vf-supabase-auth'
      }
    });
    document.getElementById('vfCloudLogin').onclick = login;
    document.getElementById('vfCloudUsers').onclick = openUserAdmin;
    document.getElementById('vfCloudLogout').onclick = logout;
    document.getElementById('vfCloudRecovery').onclick = recoveryRequest;
    document.getElementById('vfUserAdminClose').onclick = () => document.getElementById('vfUserAdmin').classList.add('hidden');
    document.getElementById('vfCreateUser').onclick = createUser;
    document.getElementById('vfNewCpf').oninput = event => event.target.value = maskCpf(event.target.value);
    document.getElementById('vfCloudPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
    document.getElementById('vfClosingFrame')?.addEventListener('load', event => {
      try { event.target.contentDocument?.getElementById('usersBtn')?.classList.add('hidden'); }
      catch (error) { console.warn('Não foi possível ocultar o controle local antigo.', error); }
    });
    const {data: {session}} = await client.auth.getSession();
    if (session) {
      try { await enterCloud(session); }
      catch (e) {
        console.error(e);
        await client.auth.signOut();
        setStatus('', 'Acesso não autorizado', 'Entre novamente.');
        document.getElementById('vfCloudError').textContent = e.message || 'Não foi possível carregar seu perfil.';
      }
    } else {
      setStatus('', 'Aguardando login', 'Informe seu acesso para conectar ao servidor.');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();

</script>
<script>/* Vital Fiscal V06: campos de vigência no cadastro principal, sem alterar componentes React existentes. */
(()=>{
'use strict';
const DATA='vitalFiscalData';
function clients(){try{return JSON.parse(localStorage.getItem(DATA)||'{}').clients||[]}catch{return[]}}
function yyyyMM(){return new Date().toISOString().slice(0,7)}
function create(label,type,id,value){let item=document.createElement('label');item.textContent=label;const input=document.createElement('input');input.type=type;input.id=id;if(type==='checkbox'){input.checked=!!value;input.style.width='auto';input.style.margin='9px'}else input.value=value||'';item.appendChild(input);return item}
function addFields(){let modal=document.querySelector('.modal.clientModal');if(!modal||modal.querySelector('#vfLifecycleBlock'))return;
 const header=modal.querySelector('.formGrid');if(!header)return;
 const fields=header.querySelectorAll('input');if(fields.length<3)return;
 const code=fields[0].value,existing=clients().find(c=>String(c.code)===String(code));
 const container=document.createElement('div');container.id='vfLifecycleBlock';container.className='formGrid';container.style.cssText='margin:16px 0;padding:16px;border:1px solid #d3e1e7;border-radius:10px;background:#f6fafc';
 container.appendChild(create('Início no Fechamento Fiscal (competência)','month','vfStartMonth',existing?.startCompetence||(existing?'':yyyyMM())));
 const active=!!existing?.inactiveFrom;const toggle=create('Inativar cliente no Fechamento Fiscal','checkbox','vfInactiveCheck',active);container.appendChild(toggle);
 const stop=create('Competência de inativação','month','vfInactiveMonth',existing?.inactiveFrom||'');container.appendChild(stop);stop.style.display=active?'':'none';
 toggle.querySelector('input').addEventListener('change',e=>{stop.style.display=e.target.checked?'':'none';if(e.target.checked&&!stop.querySelector('input').value)stop.querySelector('input').value=yyyyMM()});
 const hint=document.createElement('p');hint.style.cssText='grid-column:1/-1;color:#607a8c;font-size:12px;margin:0';hint.textContent='Início: aparece no fechamento a partir deste mês. Inativação: deixa de aparecer a partir do mês indicado. Históricos anteriores permanecem preservados.';container.appendChild(hint);
 header.after(container);
 // Captura antes da ação React. Só grava após o salvamento efetivo do cliente no armazenamento.
 modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.textContent.trim()!=='Salvar cliente')return;
  const codeValue=fields[0]?.value.trim(),start=container.querySelector('#vfStartMonth').value,inactive=container.querySelector('#vfInactiveCheck').checked,stopValue=container.querySelector('#vfInactiveMonth').value;
  if(!codeValue)return;
  if(inactive&&!stopValue){e.preventDefault();e.stopPropagation();alert('Informe a competência da inativação.');return}
  if(start&&inactive&&stopValue<=start){e.preventDefault();e.stopPropagation();alert('A inativação deve ocorrer depois da competência inicial.');return}
  setTimeout(()=>{try{const data=JSON.parse(localStorage.getItem(DATA)||'{}'),c=(data.clients||[]).find(x=>String(x.code)===codeValue);if(!c)return;
   c.startCompetence=start;c.inactiveFrom=inactive?stopValue:'';localStorage.setItem(DATA,JSON.stringify(data));
   window.dispatchEvent(new StorageEvent('storage',{key:DATA,newValue:JSON.stringify(data)}));
  }catch(err){console.error('Não foi possível atualizar vigência do cliente:',err)}},350);
 },true);
}
const watcher=new MutationObserver(addFields);watcher.observe(document.body,{childList:true,subtree:true});addFields();
})();
</script>

const back=document.getElementById('vf-caixa-backdrop');
const frame=document.getElementById('vf-caixa-frame');
const launch=document.getElementById('vf-caixa-launcher');
const close=document.getElementById('vf-caixa-close');
let loaded=false;
function openCaixa(){
 if(localStorage.getItem('vf14CaixaImportApproved')!=='1'){
  const ok=confirm('CAIXA FISCAL V17 — VALIDAÇÃO\n\nAo habilitar, o Caixa poderá gravar dados no Supabase atualmente conectado. Antes de continuar, faça um backup e tenha certeza de que está usando um ambiente de TESTES, não o escritório em produção.\n\nDeseja habilitar a integração do Caixa neste navegador?');
  if(!ok)return;
  localStorage.setItem('vf14CaixaImportApproved','1');
 }
 if(!loaded){
  const bytes=Uint8Array.from(atob(code),c=>c.charCodeAt(0));
  frame.srcdoc=new TextDecoder('utf-8').decode(bytes);
  loaded=true;
 }
 back.style.display='block';launch.style.display='none';
 if(loaded&&frame.contentWindow?.VitalCaixaReleaseLock) frame.contentWindow.dispatchEvent(new Event('vf15:ready'));
}
async function closeCaixa(){
 try{
   if(window.vfCaixaHasAnyLock?.() && frame.contentWindow?.VitalCaixaSync && !(await window.vfCaixaFlush?.())) {
    alert('O Supabase ainda NÃO confirmou a gravação do Caixa.\n\nA tela permanecerá aberta. Baixe um backup JSON do Caixa e confira as permissões do banco antes de continuar. Não atualize a página enquanto houver alterações financeiras pendentes.');return;
   }
   if(window.vfCaixaHasAnyLock?.() && !(await window.vfCaixaRelease?.())) {alert('Não foi possível confirmar a liberação do bloqueio no Supabase. Verifique a conexão e tente novamente.');return;}
   frame.contentWindow?.VitalCaixaReleaseLock?.();
 }catch(e){console.error('Caixa: não foi possível liberar a trava',e);alert('Não foi possível liberar a trava; confira a conexão antes de sair.');return;}
 back.style.display='none';launch.style.display='block';
}
function scheduleSync(){
 if(localStorage.getItem('vf14CaixaImportApproved')!=='1')return;
 if(!loaded){const bytes=Uint8Array.from(atob(code),c=>c.charCodeAt(0));frame.srcdoc=new TextDecoder('utf-8').decode(bytes);loaded=true}
 const attempt=()=>{try{if(frame.contentWindow?.VitalCaixaSync)frame.contentWindow.VitalCaixaSync.run()}catch(e){console.warn('Caixa: sincronização pendente',e)}};
 frame.addEventListener('load',attempt,{once:true});attempt();
}
window.addEventListener('message',e=>{
 if(e.source===document.getElementById('vfClosingFrame')?.contentWindow&&e.data?.type==='vital-closing-saved')scheduleSync();
});
window.addEventListener('vf:caixa-lock-lost',()=>{try{frame.contentWindow?.postMessage({type:'vf15:lock-lost'},'*')}catch{}});
window.addEventListener('vf:remote-update',e=>{
 if(e.detail?.key==='vitalFechamentoTeste'||e.detail?.key==='vitalFiscalData')scheduleSync();
 if(e.detail?.key==='vitalCaixaFiscalV07'&&loaded){try{frame.contentWindow?.dispatchEvent(new StorageEvent('storage',{key:'vitalCaixaFiscalV07',newValue:localStorage.getItem('vitalCaixaFiscalV07')}))}catch{}}
});
launch.addEventListener('click',openCaixa);
close.addEventListener('click',closeCaixa);
})();

<style id="vf-v13-style">
#vf-caixa-launcher{display:none!important}
.vf-caixa-card{border:1.5px solid #08a4bb;border-radius:11px;padding:28px 25px;min-height:210px;display:flex;gap:21px;background:#fff;align-items:flex-start}
.vf-caixa-card .vf-caixa-icon{width:66px;height:66px;border-radius:14px;flex:0 0 auto;background:linear-gradient(145deg,#08b3c7,#058ca8);color:#fff;display:grid;place-items:center;font-size:30px}
.vf-caixa-card h3{font-size:19px;margin:9px 0;color:#0d2a4b}.vf-caixa-card p{color:#63758a;line-height:1.5;max-width:350px}
.vf-caixa-card button{border:0;border-radius:7px;padding:12px 16px;background:linear-gradient(135deg,#0783a8,#08a8bd);color:#fff;font-weight:700;cursor:pointer}
@media(max-width:680px){.vf-caixa-card{display:block}.vf-caixa-card .vf-caixa-icon{margin-bottom:9px}}
</style>
<script id="vf-v13-card-script">
(function(){
 'use strict';
 const launch=document.getElementById('vf-caixa-launcher');
 if(!launch)return;
 function ensureCard(){
  for(const heading of document.querySelectorAll('h3')){
   if(heading.textContent.trim()!=='Fechamento Fiscal')continue;
   const tools=heading.closest('.tools');
   if(!tools||tools.querySelector('.vf-caixa-card'))continue;
   const card=document.createElement('article');card.className='vf-caixa-card';
   const icon=document.createElement('div');icon.className='vf-caixa-icon';icon.textContent='▣';
   const content=document.createElement('div');
   const title=document.createElement('h3');title.textContent='Caixa Fiscal';
   const desc=document.createElement('p');desc.textContent='Compras, faturamento e despesas. Integração mensal em homologação — conflito simultâneo bloqueado.';
   const button=document.createElement('button');button.type='button';button.textContent='Abrir ferramenta ›';
   button.addEventListener('click',()=>launch.click());
   content.append(title,desc,button);card.append(icon,content);
   tools.insertBefore(card,tools.children[2]||null);
  }
 }
 let busy=false;
 const observer=new MutationObserver(()=>{
  if(busy)return;
  busy=true;
  try{ensureCard()}finally{busy=false}
 });
 observer.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
 ensureCard();
})();
</script>
