<style>
:root{
  --navy:#082846;--navy2:#051d34;--cyan:#0aa7ba;--gold:#d5aa32;
  --bg:#f4f7f9;--panel:#fff;--ink:#173149;--muted:#6b7d8e;--line:#dbe4e9;
  --green:#198754;--red:#c94b40;--blue:#2f69bd;--orange:#e78a18;--purple:#7258ad;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:20px 12px;display:flex;flex-direction:column;z-index:10;overflow:auto}
.brand{padding:6px 10px 16px;border-bottom:1px solid #ffffff22;margin-bottom:10px}
.brand{text-align:center}
.brand img{display:block;width:170px;max-width:100%;margin:0 auto 10px;filter:drop-shadow(0 2px 6px #0006)}
.brand strong{display:block;font-size:15px;letter-spacing:2px;color:var(--gold)}.brand small{color:#bfd0dc;font-size:11px}
.repHead{display:flex;align-items:center;gap:18px}
.repHead img,.sheetTitle .sheetLogo{background:linear-gradient(180deg,var(--navy),var(--navy2));border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;flex:none}
.repHead img{height:86px;padding:8px 14px}
.sheetTitle .sheetLogo{height:38px;padding:3px 7px;margin-right:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{border:0;background:transparent;color:#eef6fb;text-align:left;padding:8px 10px;border-radius:9px;position:relative;display:flex;align-items:center;gap:10px}
.nav button:hover,.nav button.active{background:#154267}
.nav .ni{width:19px;height:19px;flex:none;color:var(--gold)}
.nav .nl{flex:1;line-height:1.25}
.nav kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:10px Arial,sans-serif;color:#d9e5ee;background:#0d3052;border:1px solid #ffffff38;border-radius:4px;padding:1px 5px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.nav button:hover kbd{opacity:1}
.nav .sep{height:1px;background:#ffffff1f;margin:7px 4px}
.nav .count{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:2px 7px;font-weight:700}
.foot{margin-top:auto;padding:10px;color:#b7c7d3;font-size:11px}
.main{margin-left:250px;padding:22px 28px 60px;max-width:1650px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:12px}
.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:var(--muted);font-size:14px}
.filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.filters label,.filterBar label,.fl{font-size:12px;font-weight:700;color:var(--muted)}
.filters select,.filters input,.filterBar select,.filterBar input{display:block;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:110px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:5px}
.seg button{border:0;background:#fff;padding:9px 16px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.periodNav{display:flex;gap:4px;align-items:center;margin-top:5px}
.periodNav input{margin-top:0!important}
.periodNav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700}
.hint{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.5}
.hint b{color:var(--ink)}
.filterBar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:4px 0 12px;padding:10px;background:#f8fafb;border:1px solid var(--line);border-radius:10px}
.filterBar input[data-fn="q"]{min-width:230px}
.panel,.summaryCard{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #173b5a0d}
.panel{padding:18px;margin-bottom:16px}
.quickBar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.quickBar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px;font-weight:700;color:var(--ink);box-shadow:0 3px 10px #173b5a0a}
.quickBar button:hover{border-color:var(--cyan);color:#08788a}
.quickBar button b{color:var(--cyan);margin-right:6px}
.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.summaryCard{padding:16px 18px;cursor:pointer;transition:border-color .15s}.summaryCard:hover{border-color:var(--cyan)}
.summaryCard small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;font-weight:700}
.summaryCard b{display:block;font-size:24px;margin-top:6px}.summaryCard p{margin:6px 0 0;color:var(--muted);font-size:12px}
.summaryCard.cash{border-top:4px solid var(--purple)}.summaryCard.cash b{color:var(--purple)}
.summaryCard.buy{border-top:4px solid var(--blue)}.summaryCard.sale{border-top:4px solid var(--green)}
.summaryCard.exp{border-top:4px solid var(--orange)}.summaryCard.stock{border-top:4px solid var(--gold)}.summaryCard.res{border-top:4px solid var(--navy)}
.summaryCard.buy b{color:var(--blue)}.summaryCard.sale b{color:var(--green)}.summaryCard.exp b{color:var(--red)}.summaryCard.stock b{color:#9b7606}
.panel h2{margin:0 0 6px;font-size:18px}.panel h3{margin:0 0 10px;font-size:15px}.desc{margin:0 0 12px;color:var(--muted);font-size:13px}
.sectionTitle{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.sectionTitle h2{margin:0}
.primary,.secondary,.danger,.success,.warning,.iconBtn,.ghost{border-radius:8px;padding:7px 11px;font-weight:700;font-size:13px;white-space:nowrap}
.primary{border:0;background:linear-gradient(135deg,#0789a6,#0fb0c1);color:#fff}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.danger{border:1px solid #e6b6b1;background:#fff;color:#b33b32}
.success{border:0;background:#198754;color:#fff}
.warning{border:1px solid #f0d19a;background:#fff8e8;color:#98620b}
.ghost{border:0;background:transparent;color:#08788a;padding:4px 6px}
.iconBtn{border:1px solid #9cced5;background:#effbfd;color:#08788a;padding:8px 11px;min-width:38px}
.fieldWithIcon{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:end}
.kpiGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.miniKpi{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdfe}
.miniKpi small{display:block;color:var(--muted)}.miniKpi b{display:block;font-size:18px;margin-top:5px}
.miniKpi.red b{color:var(--red)}.miniKpi.green b{color:var(--green)}.miniKpi.orange b{color:var(--orange)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #e8edf1;text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;color:#607286;background:#f9fbfc}
tfoot td{font-weight:700;background:#f4f8fa;border-top:2px solid var(--line)}
tr.late td{background:#fff5f4}tr.zero td{background:#fffaf0}tr.off td{color:#8a99a6}
tr.click{cursor:pointer}tr.click:hover td{background:#eef8fa}
.scroll{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
.scroll table{border-collapse:separate;border-spacing:0}
.scroll thead th{position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}
.scroll tfoot td{position:sticky;bottom:0;z-index:2}
.scroll.flat{max-height:none}.scroll.flat tfoot td{position:static}
/* Caixa no formato da planilha */
.sheetPanel{--ol:#4b6b2a;--ol2:#eef4e4;--yl:#fff4b8;--or:#f6d3ad}
.sheetTitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;padding:10px 14px;border:1px solid var(--ol);border-radius:10px 10px 0 0;background:#fff;color:var(--ink)}
.sheetTitle span{font-size:12px;color:#fff;background:var(--ol);padding:4px 10px;border-radius:14px}
.sheetBand{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--ol);border-top:0;border-radius:0 0 10px 10px;overflow:hidden}
.sheetBand>div{border-right:1px solid #4b6b2a40;background:#fff;text-align:center}.sheetBand>div:last-child{border-right:0}
.sheetBand small{display:block;background:var(--ol);color:#fff;font-weight:800;padding:8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.sheetBand b{display:block;padding:10px 6px 2px;font-size:17px}.sheetBand i{display:block;font-style:normal;font-size:11px;color:var(--muted);padding-bottom:8px}
.sheetBand .yellow{background:var(--yl)}.sheetBand .orange{background:var(--or)}
table.sheet th{background:var(--ol);color:#fff;text-align:center;font-size:12px}
table.sheet th:first-child,table.sheet td:first-child{text-align:left;font-weight:700;white-space:nowrap}
table.sheet th{white-space:nowrap}
table.sheet tbody tr:nth-child(even) td{background:var(--ol2)}
table.sheet tbody tr.cur td{background:#fff9db;box-shadow:inset 0 1px 0 #e9cf5b,inset 0 -1px 0 #e9cf5b}
table.sheet tbody tr:hover td{background:#dcebf0}
table.sheet tr.tot td{background:var(--yl);font-weight:800;font-size:14px;border-top:2px solid var(--ol)}
table.sheet tr.avg td{background:var(--ol);color:#fff;font-weight:800}table.sheet tr.avg td .neg{color:#ffd0cb}
.avgCount{background:#c94b40;color:#fff;border-radius:12px;padding:3px 10px;font-size:12px}
@media(max-width:1180px){.sheetBand{grid-template-columns:repeat(4,1fr)}}
@media(max-width:840px){.sheetBand{grid-template-columns:repeat(2,1fr)}}
.num{text-align:right;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.formGrid.two{grid-template-columns:1fr 1fr}
.formGrid label,.fieldWithIcon label{font-size:12px;font-weight:700;color:#425b70}
.formGrid input,.formGrid select,.formGrid textarea,.fieldWithIcon input,.fieldWithIcon select{width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fbfdfe}
textarea{min-height:64px;resize:vertical}
.notice{padding:10px 12px;border-radius:9px;background:#eef9fb;color:#176477;font-size:13px;margin-bottom:12px}
.alert{padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.alert.red{background:#fdecea;color:#9c2f26}.alert.orange{background:#fff2dd;color:#8a5506}.alert.blue{background:#eef9fb;color:#176477}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.tableActions{display:flex;gap:5px;flex-wrap:nowrap;justify-content:flex-end}
.hidden{display:none!important}.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 9px;border-radius:16px;font-weight:700;font-size:11px;white-space:nowrap}
.badge.ok{background:#e8f6ed;color:#167341}.badge.wait{background:#fff2dd;color:#a76707}
.badge.cancel{background:#eceff2;color:#65727f}.badge.late{background:#fdecea;color:#b33b32}
.badge.part{background:#e9f0fb;color:#2f69bd}.badge.zero{background:#fff2dd;color:#a76707;border:1px dashed #e0a84a}
.badge.fix{background:#f1ecfa;color:#7258ad}
.badge.area-dp{background:#e6effc;color:#1f5bb5}.badge.area-fiscal{background:#fdf1d6;color:#8f5d00}.badge.area-outras{background:#eceff2;color:#5d6b78}
.ord{display:inline-flex;flex-direction:column;line-height:0;vertical-align:middle}
.ord button{border:0;background:transparent;color:#9aa8b4;opacity:.4;font-size:9px;padding:2px 5px;height:13px;cursor:pointer}
td:has(> .ord){width:26px;padding-right:0}
tr:hover .ord button{opacity:1}.ord button:hover{color:var(--navy);transform:scale(1.25)}
.areaBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:13px}
.installmentBox{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:45vh}
.installmentBox table{min-width:760px}
.installmentBox input,.installmentBox select{width:100%;padding:6px;border:1px solid var(--line);border-radius:6px}
.subtle{font-size:11px;color:var(--muted);margin-top:5px}
.formSection{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:700;color:var(--muted)}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.dangerZone{border:1px solid #e6b6b1;background:#fff7f6;border-radius:10px;padding:16px;margin-top:12px}
.big{font-size:22px;font-weight:800}
@media print{.sidebar,.filters,.filterBar,.tableActions,.actions,.top button,.noPrint,.quickBar{display:none!important}.main{margin:0;padding:0}.panel{box-shadow:none;break-inside:avoid}.scroll{max-height:none;overflow:visible;border:0}}
@media(max-width:1180px){.summaryGrid{grid-template-columns:repeat(2,1fr)}.kpiGrid{grid-template-columns:1fr 1fr}}
@media(max-width:840px){.sidebar{position:static;width:auto}.main{margin:0;padding:14px}.summaryGrid,.kpiGrid,.formGrid,.formGrid.two{grid-template-columns:1fr}.hint{margin-left:0;text-align:left}}
.fiCashPreview{margin-top:10px;padding:10px 12px;border:1px solid #c9d7df;border-radius:8px;background:#f6fafc;font-size:13px}.fiCashPreview .pos{color:#087647;font-weight:700}.fiCashPreview .neg{color:#b43d34;font-weight:700}.fiWarn{margin-top:7px;color:#9a4e00;font-weight:700}
</style>
</head>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
var KEY="vitalCaixaFiscalV07",OLDKEYS=["vitalCaixaFiscalV06","vitalCaixaFiscalV05"];
function localISO(d){d=d||new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
var TODAY=localISO(),currentMonth=TODAY.slice(0,7);
var MONTHS=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

var seed={
  companies:[{id:"c1",code:"001",name:"EMPRESA TESTE LTDA",doc:"",active:true}],
  purchases:[],sales:[],expenses:[],payables:[],finance:[],assets:[],profits:[],returns:[],
  openingStock:[],counterparties:[],institutions:[],partners:[],
  cashOpening:[],cashEntries:[],recurring:[],
  documentTypes:[
    {id:"doc1",name:"NF-e",active:true},{id:"doc2",name:"NFS-e",active:true},{id:"doc3",name:"NFC-e",active:true},
    {id:"doc4",name:"Recibo",active:true},{id:"doc5",name:"Guia / Boleto",active:true},{id:"doc6",name:"Outros",active:true},{id:"doc7",name:"CT-e",active:true}
  ],
  expenseTypes:[
    {id:"exp1",expenseCode:"DM",name:"Pró-Labore",description:"Pró-Labore",accountCode:"4.01.001",historyCode:"H001",history:"Pgto. pró-labore ref. {competencia}",area:"DP",active:true},
    {id:"exp2",expenseCode:"DM",name:"Salários e Remunerações",description:"Salários e Remunerações",accountCode:"4.01.002",historyCode:"H002",history:"Pgto. salários e remunerações ref. {competencia}",area:"DP",active:true},
    {id:"exp3",expenseCode:"DM",name:"DAS Simples Nacional",description:"DAS Simples Nacional",accountCode:"4.02.001",historyCode:"H003",history:"Pgto. DAS Simples Nacional ref. {competencia}",area:"Fiscal",active:true},
    {id:"exp4",expenseCode:"0",name:"Energia Elétrica",description:"Energia Elétrica",accountCode:"4.03.001",historyCode:"H004",history:"Pgto. conta de energia elétrica ref. {competencia}",area:"Outras",active:true}
  ],
  assetGroups:[
    {id:"ag1",name:"Veículos",fields:["Modelo","Ano/Modelo","Placa","Renavam","Chassi"],active:true},
    {id:"ag2",name:"Máquinas e Equipamentos",fields:["Marca","Modelo","Nº de Série"],active:true},
    {id:"ag3",name:"Móveis e Utensílios",fields:["Marca","Modelo"],active:true},
    {id:"ag4",name:"Informática",fields:["Marca","Modelo","Nº de Série"],active:true}
  ],
  cashCategories:["Aporte de sócio","Retirada de sócio","Tarifa bancária","Rendimento de aplicação","Transferência entre contas","Ajuste de caixa","Outros"],
  settings:{expenseStockPercent:0},
  version:7
};
var LAUNCH_TABLES=["purchases","sales","expenses","payables","finance","assets","profits","returns","cashEntries","cashOpening","openingStock"];

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s)return migrate(Object.assign(clone(seed),{version:6},s));
    for(var i=0;i<OLDKEYS.length;i++){
      var old=JSON.parse(localStorage.getItem(OLDKEYS[i])||"null");
      if(old)return migrate(Object.assign(clone(seed),{version:5},old,i===0?{version:old.version||6}:{version:5}));
    }
  }catch(e){}
  return clone(seed)
}
/* V05 → V06: toda movimentação passa a ter parcelas (fonte única do status). V06 → V07: campos novos. */
function migrate(d){
  if(d.version<6){
    var derived=(d.payables||[]).filter(function(p){return p.sourceId});
    ["purchases","sales","expenses"].forEach(function(t){
      (d[t]||[]).forEach(function(r){
        ensureInst(r);
        r.installments.forEach(function(p){
          var m=derived.find(function(x){return x.sourceId===r.id&&x.dueDate===p.dueDate&&Math.abs(x.amount-p.amount)<0.01});
          if(m&&m.status)p.status=m.status;
          if(p.status==="Pago"&&!p.paidDate)p.paidDate=p.dueDate||r.date;
        })
      })
    });
    (d.finance||[]).forEach(function(r){ensureInst(r);if(!r.date)r.date=(r.competence||currentMonth)+"-01"});
    d.payables=(d.payables||[]).filter(function(p){return !p.sourceId}).map(function(p){
      return {id:p.id,companyId:p.companyId,competence:p.competence,dir:"pagar",partyId:p.partyId,partyName:p.partyName,description:p.description||"Conta avulsa",date:p.dueDate,amount:p.amount,
        installments:[{id:uid(),number:1,dueDate:p.dueDate,amount:p.amount,status:p.status||"Em aberto",paidDate:p.status==="Pago"?p.dueDate:""}]}
    });
    (d.assets||[]).forEach(function(a){if(a.cashOut==null)a.cashOut=false});
  }
  ["purchases","sales","expenses","payables","finance"].forEach(function(t){(d[t]||[]).forEach(ensureInst)});
  (d.assets||[]).forEach(function(a){if(!a.status)a.status="Ativo"});
  (d.companies||[]).forEach(function(c){if(c.active==null)c.active=true});
  if(d.documentTypes&&!d.documentTypes.some(function(t){return /CT-?e/i.test(t.name)}))d.documentTypes.push({id:"doc7",name:"CT-e",active:true});
  (d.recurring||[]).forEach(function(r){if(!r.skip)r.skip=[]});
  // veículos: campo Ano/Modelo logo após Modelo
  // setor da despesa (DP / Fiscal / Outras): tipos antigos recebem o setor pelo nome
  (d.expenseTypes||[]).forEach(function(t){if(!t.area)t.area=areaFromName(t.name)});
  // CNPJ/CPF já cadastrados: formata (só quando forem números de CPF/CNPJ completos)
  var fd=function(v){var n=digits(v);return n.length===11||n.length===14?fmtDoc(n):v};
  (d.companies||[]).forEach(function(c){c.doc=fd(c.doc)});
  (d.counterparties||[]).forEach(function(c){c.doc=fd(c.doc)});
  (d.partners||[]).forEach(function(p){p.cpf=fd(p.cpf)});
  (d.assets||[]).forEach(function(a){if(a.sellerDoc)a.sellerDoc=fd(a.sellerDoc);if(a.disposal&&a.disposal.buyerDoc)a.disposal.buyerDoc=fd(a.disposal.buyerDoc)});
  (d.assetGroups||[]).forEach(function(g){if(/ve[ií]culo/i.test(g.name)&&(g.fields||[]).indexOf("Ano/Modelo")<0){var i=(g.fields||[]).indexOf("Modelo");g.fields=g.fields||[];g.fields.splice(i>=0?i+1:0,0,"Ano/Modelo")}});
  d.version=7;
  return d
}
var db=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Não foi possível salvar no navegador: "+e.message)}}
var modalRefresh=null;
function save(){persist();renderAll();if(modalRefresh)modalRefresh()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function smoney(n){return '<span class="'+(n<0?"neg":"")+'">'+money(n)+'</span>'}
function parseMoney(v){
  v=String(v==null?"":v).trim();var neg=v.indexOf("-")>=0;
  v=v.replace(/\./g,"").replace(",",".").replace(/[^\d.]/g,"");
  var n=Number(v)||0;return neg?-n:n
}
function brNumber(n){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function moneyMask(id,allowNeg){
  var el=typeof id==="string"?$(id):id;if(!el)return;
  el.addEventListener("input",function(){
    var neg=allowNeg&&this.value.indexOf("-")>=0,d=this.value.replace(/\D/g,"");
    this.value=d?(neg?"-":"")+(Number(d)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):(neg?"-":"")
  })
}
function fmtDate(d){if(!d)return "";var p=d.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d}
function compLabel(v){if(!v)return "";var p=v.split("-");return MONTHS[Number(p[1])-1]+"/"+p[0]}
function pad(n){return String(n).padStart(2,"0")}
function daysIn(month){var p=month.split("-");return new Date(Number(p[0]),Number(p[1]),0).getDate()}

  y+=Math.floor(m/12);m=((m%12)+12)%12;var max=new Date(y,m+1,0).getDate();

}
function paidVal(p){return p.paidAmount!=null&&p.paidAmount!==""?Number(p.paidAmount)||0:Number(p.amount)||0}

function instStatus(r){
  var ps=(r.installments||[]).filter(function(p){return p.status!=="Cancelado"});
  if(!ps.length)return "Cancelado";
  var paid=ps.filter(function(p){return p.status==="Pago"}).length;

/* ---------- Caixa ---------- */
function cashMoves(){
  var m=[];
  // Compras e faturamento movimentam o caixa pelas parcelas pagas ou recebidas.
  allTitles().forEach(function(t){
    if(t.p.status!=="Pago"||t.p.noCash)return;
    m.push({date:t.p.paidDate||t.p.dueDate||"",dir:t.dir==="receber"?"in":"out",amount:paidVal(t.p),origin:t.origin,desc:(t.party?t.party+" — ":"")+t.desc+(t.n>1&&!t.p.isEntry?" ("+t.p.number+"/"+t.n+")":""),ref:{src:t.src,id:t.rec.id}})
  });
  byCompany(db.finance).forEach(function(f){
    if(Number(f.cashIn)>0)m.push({date:f.date,dir:"in",amount:Number(f.cashIn),origin:"Financiamento",desc:"Crédito "+(f.kind||"")+" — "+(f.institutionName||""),ref:{src:"finance",id:f.id}});
    /* a entrada entra no caixa pelo título "Entrada" do contrato (allTitles) */
  });
  byCompany(db.profits).forEach(function(p){m.push({date:p.date||(p.competence+"-01"),dir:"out",amount:p.amount,origin:"Lucros",desc:"Distribuição — "+(p.partnerName||""),ref:{src:"profits",id:p.id}})});
  byCompany(db.returns).forEach(function(r){m.push({date:r.competence?r.competence+"-01":r.date,dir:r.type==="Devolução de compra"?"in":"out",amount:r.amount,origin:"Devolução",desc:r.type+" — "+(r.description||r.documentNumber||""),ref:{src:"returns",id:r.id}})});
  byCompany(db.assets).forEach(function(a){
    if(a.cashOut)m.push({date:a.date,dir:"out",amount:a.amount,origin:"Ativo",desc:"Aquisição — "+(a.description||""),ref:{src:"assets",id:a.id}});
    if(a.status==="Baixado"&&a.disposal&&Number(a.disposal.saleValue)>0&&a.disposal.toCash!==false)m.push({date:a.disposal.date,dir:"in",amount:Number(a.disposal.saleValue),origin:"Ativo",desc:"Baixa ("+a.disposal.reason+") — "+(a.description||""),ref:{src:"assets",id:a.id}});
  });
  byCompany(db.cashEntries).forEach(function(c){m.push({date:c.date,dir:c.type==="Entrada"?"in":"out",amount:c.amount,origin:"Avulso",desc:(c.category?c.category+" — ":"")+(c.description||""),ref:{src:"cashEntries",id:c.id}})});
  return m.filter(function(x){return x.date}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})
}
function net(moves,from,to){return sum(moves.filter(function(x){return x.date>=from&&x.date<=to}),function(x){return x.dir==="in"?x.amount:-x.amount})}
function manualOpening(y){return byCompany(db.cashOpening).find(function(x){return Number(x.year)===Number(y)})}
/* Saldo inicial do ano: informado (só para começar) ou o saldo final calculado do ano anterior. */
function yearOpening(y,moves){
  moves=moves||cashMoves();
  var man=manualOpening(y);if(man)return {amount:Number(man.amount)||0,source:"manual"};
  var prevMan=byCompany(db.cashOpening).map(function(x){return Number(x.year)}).filter(function(v){return v<y}).sort(function(a,b){return b-a})[0];
  var firstMove=moves.length?Number(moves[0].date.slice(0,4)):null;
  var base=prevMan!=null?prevMan:firstMove;
  if(base==null||base>=y)return {amount:0,source:"none"};
  var start=prevMan!=null?Number(manualOpening(prevMan).amount)||0:0;
  return {amount:start+net(moves,base+"-01-01",(y-1)+"-12-31"),source:"auto"}
}
function cashSummary(){
  var moves=cashMoves(),y=refYear(),yo=yearOpening(y,moves);
  var opening=yo.amount+(S.mode==="month"?net(moves,y+"-01-01",S.month+"-00"):0);
  if(S.mode==="all"){ // todos os períodos: parte do saldo inicial mais antigo
    var years=byCompany(db.cashOpening).map(function(x){return Number(x.year)}).concat(moves.length?[Number(moves[0].date.slice(0,4))]:[]);
    var fy=years.length?Math.min.apply(null,years):y;yo=yearOpening(fy,moves);opening=yo.amount;y=fy
  }
  var inP=moves.filter(function(x){return inPeriodDate(x.date)});
  var ins=sum(inP.filter(function(x){return x.dir==="in"}),function(x){return x.amount}),outs=sum(inP.filter(function(x){return x.dir==="out"}),function(x){return x.amount});
  return {yearOpening:yo,opening:opening,ins:ins,outs:outs,closing:opening+ins-outs,moves:inP,all:moves,year:y}
}
function cashByMonth(y,moves){
  moves=moves||cashMoves();var bal=yearOpening(y,moves).amount,rows=[];
  for(var i=1;i<=12;i++){
    var mk=y+"-"+pad(i),mm=moves.filter(function(x){return x.date.slice(0,7)===mk});
    var ins=sum(mm.filter(function(x){return x.dir==="in"}),function(x){return x.amount}),outs=sum(mm.filter(function(x){return x.dir==="out"}),function(x){return x.amount});
    rows.push({month:mk,opening:bal,ins:ins,outs:outs,closing:bal+ins-outs});bal+=ins-outs
  }
  return rows
}

/* ---------- Totais por mês (compras/faturamento: competência; despesas: pagamento) ---------- */
function monthData(mk){
  var f=function(arr){return sum(byCompany(arr).filter(function(x){return x.competence===mk}),function(x){return x.amount})};
  var rets=byCompany(db.returns).filter(function(x){return x.competence===mk});
  var dc=sum(rets.filter(function(x){return x.type==="Devolução de compra"}),function(x){return x.amount}),dv=sum(rets.filter(function(x){return x.type==="Devolução de venda"}),function(x){return x.amount});
  var sales=byCompany(db.sales).filter(function(x){return x.competence===mk}),byRev=function(t){return sum(sales.filter(function(x){return revTypeOf(x)===t}),function(x){return x.amount})};
  // pg / vmg = valor das notas como lançado (sem abater devolução) — usados nas colunas do Caixa
  var r={month:mk,p:f(db.purchases)-dc,v:f(db.sales)-dv,d:paidInMonth(mk),dc:dc,dv:dv,vm:byRev("venda")-dv,vs:byRev("servico"),vc:byRev("cte"),pg:f(db.purchases),vmg:byRev("venda")};r.result=r.v-r.p-r.d;return r
}
/* Tipo de receita do faturamento: venda de mercadorias, prestação de serviço ou CT-e (transporte) */
var REV_TYPES=[["venda","Venda de mercadorias"],["servico","Prestação de serviço"],["cte","CT-e (transporte)"]];
function revTypeFromDoc(name){name=name||"";return /NFS/i.test(name)?"servico":/CT-?e/i.test(name)?"cte":"venda"}
// a coluna do Caixa vem sempre do documento: NFS-e → serviço; CT-e → CT-e; demais (NF-e, NFC-e...) → NF-e/NFC-e
/* Máscaras: CNPJ/CPF (até 11 números = CPF; 12 a 14 = CNPJ) e data dd/mm/aaaa */
function fmtDoc(v){
  var d=String(v||"").replace(/\D/g,"").slice(0,14);if(!d)return String(v||"").trim()?String(v).trim():"";
  if(d.length<=11)return d.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  return d.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2")
}
function fmtDateTyping(v){var d=String(v||"").replace(/\D/g,"").slice(0,8);return d.length>4?d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4):d.length>2?d.slice(0,2)+"/"+d.slice(2):d}
function onMaskInput(e){
  var el=e.target,m=el&&el.getAttribute&&el.getAttribute("data-mask");if(!m)return;
  if(m==="doc")el.value=fmtDoc(el.value);
  if(m==="date")el.value=fmtDateTyping(el.value)
}
function digits(v){return String(v||"").replace(/\D/g,"")}
/* Setor da despesa: DP (departamento pessoal), Fiscal ou Outras. Vem do tipo de despesa e pode ser trocado no lançamento. */
var AREAS=["DP","Fiscal","Outras"],AREA_LABEL={DP:"DP — Departamento Pessoal",Fiscal:"Fiscal — impostos e tributos",Outras:"Outras despesas"};
function areaFromName(n){n=n||"";
  if(/pr[oó].?labore|sal[aá]ri|f[eé]rias|fgts|inss|d[eé]cimo|13[ºo°]|rescis|vale.?(transp|alim|refei)|pessoal|folha|encargos|benef[ií]cio/i.test(n))return "DP";
  if(/\bdas\b|simples|icms|\biss\b|\bpis\b|cofins|irpj|csll|imposto|tribut|difal|\bipi\b|darf|parcelamento/i.test(n))return "Fiscal";
  return "Outras"}
function expArea(x){if(x.area)return x.area;var t=findBy(db.expenseTypes,x.expenseTypeId);return t.area||areaFromName(t.name||x.expenseTypeName)}
function areaBadge(a){a=a||"Outras";return '<span class="badge area-'+a.toLowerCase()+'">'+a+'</span>'}
function areaTotals(items,valFn){var o={DP:0,Fiscal:0,Outras:0};items.forEach(function(i){o[i.area]+=valFn(i)});return o}
function areaSummary(o){return AREAS.map(function(a){return areaBadge(a)+' <b>'+money(o[a])+'</b>'}).join('&nbsp;&nbsp;&nbsp;')}

function monthlyTotals(y){var rows=[];for(var i=1;i<=12;i++)rows.push(monthData(y+"-"+pad(i)));return rows}
/* Estoque: parte do último estoque inicial informado e é carregado mês a mês automaticamente. */
/* Como na planilha: estoque = anterior + compras × (1 + %Estoque) − vendas de mercadorias.
   %Estoque = margem aplicada às compras (as vendas estão a preço de venda). Devoluções já abatidas de compras e vendas. */
function stockPct(){return Number(db.settings.expenseStockPercent||0)/100}
function stockFlow(mk){var m=monthData(mk);return m.p*(1+stockPct())-m.vm}
function stockOpening(startComp){
  var base=byCompany(db.openingStock).filter(function(x){return x.competence<=startComp}).sort(function(a,b){return a.competence<b.competence?1:-1})[0];
  if(!base){ // sem estoque informado: parte de zero desde a primeira compra/venda
    var first=byCompany(db.purchases).concat(byCompany(db.sales)).map(function(x){return x.competence||""}).filter(Boolean).sort()[0];
    if(!first||first>=startComp)return {amount:0,source:"none"};
    var a0=0;for(var m0=first;m0<startComp;m0=nextMonth(m0))a0+=stockFlow(m0);
    return {amount:a0,source:"none"}
  }
  var amt=Number(base.amount)||0;for(var m=base.competence;m<startComp;m=nextMonth(m))amt+=stockFlow(m);
  return {amount:amt,source:base.competence===startComp?"manual":"auto",base:base}
}
function totals(){
  var p=sum(scoped(db.purchases),function(x){return x.amount}),v=sum(scoped(db.sales),function(x){return x.amount}),d=expPaidTotal();
  var rets=scoped(db.returns),dc=sum(rets.filter(function(x){return x.type==="Devolução de compra"}),function(x){return x.amount}),dv=sum(rets.filter(function(x){return x.type==="Devolução de venda"}),function(x){return x.amount});
  var pc=periodComps(),startComp=pc[0],endComp=pc[1],so=stockOpening(startComp),estimated=so.amount;
  for(var m=startComp;m<=endComp;m=nextMonth(m))estimated+=stockFlow(m);
  return {p:p,v:v,d:d,dOpen:expOpenTotal(),dc:dc,dv:dv,pn:p-dc,vn:v-dv,stockOpening:so,stock:Math.max(0,estimated),result:(v-dv)-(p-dc)-d}
}
/* Médias do ano: de JAN até o mês de referência (mês selecionado; na visão anual, o mês atual ou DEZ). */
function yearAverages(){
  var y=refYear(),curY=Number(currentMonth.slice(0,4)),lastM;
  if(S.mode==="month")lastM=Number(S.month.slice(5));else lastM=y<curY?12:y===curY?Number(currentMonth.slice(5)):0;
  // começa no primeiro mês com movimento, para não diluir a média com meses antes do início do uso
  var all=monthlyTotals(y).slice(0,lastM),first=all.findIndex(function(r){return r.v||r.p||r.d});
  var rows=first<0?[]:all.slice(first);
  while(rows.length&&!(rows[rows.length-1].v||rows[rows.length-1].p||rows[rows.length-1].d))rows.pop();
  var n=rows.length||1;
  var k=function(f){var tot=sum(rows,f),best=rows.slice().sort(function(a,b){return f(b)-f(a)})[0];return {total:tot,avg:tot/n,best:best?{m:best.month,v:f(best)}:null}};
  return {y:y,n:rows.length,from:rows.length?rows[0].month:y+"-01",to:rows.length?rows[rows.length-1].month:y+"-01",rows:rows,
    v:k(function(r){return r.v}),p:k(function(r){return r.p}),d:k(function(r){return r.d}),r:k(function(r){return r.result})}
}

/* ---------- Contas fixas (pagamentos recorrentes) ---------- */
function fillHist(h,month,party,docn){return String(h||"").split("{competencia}").join(compLabel(month)).split("{fornecedor}").join(party||"").split("{documento}").join(docn||"")}
function recurringInRange(r,month){return r.active!==false&&(!r.startMonth||r.startMonth<=month)&&(!r.endMonth||r.endMonth>=month)}
function recurringMissing(month){
  return byCompany(db.recurring).filter(function(r){
    return recurringInRange(r,month)&&(r.skip||[]).indexOf(month)<0&&!db.expenses.some(function(e){return e.recurringId===r.id&&e.competence===month})
  })
}
function generateRecurring(month,only){
  var list=recurringMissing(month).filter(function(r){return !only||r.id===only});
  list.forEach(function(r){pushRecurringExpense(r,month)});
  return list.length
}
/* cria a despesa "a pagar" de uma conta fixa para uma competência */
function pushRecurringExpense(r,month){
  var typ=findBy(db.expenseTypes,r.expenseTypeId),party=findBy(db.counterparties,r.partyId);
  var dueM=recDueMonth(r,month),due=dueM+"-"+pad(Math.min(Number(r.dueDay)||10,daysIn(dueM)));
  db.expenses.push({id:uid(),companyId:r.companyId,date:due,expenseTypeId:r.expenseTypeId,expenseTypeName:typ.name||"",partyId:r.partyId||"",partyName:party.name||"",
    documentTypeId:"",documentTypeName:"",documentNumber:"",description:r.description||typ.description||typ.name||"",historyCode:typ.historyCode||"",
    history:fillHist(typ.history,month,party.name,""),amount:Number(r.amount)||0,dueDate:due,competence:month,recurringId:r.id,cond:"prazo",
    installments:[{id:uid(),number:1,dueDate:due,amount:Number(r.amount)||0,status:"Em aberto"}]})
}
/* Mês do vencimento x competência: "vence no mês seguinte" (DAS, FGTS...) ou "no próprio mês" (aluguel, energia...) */
function recDueMonth(r,comp){return r.dueNextMonth?nextMonth(comp):comp}
function recCompForDue(r,dueMonth){return r.dueNextMonth?prevMonth(dueMonth):dueMonth}
/* CONTAS FIXAS AUTOMÁTICAS: o mês que você abre é o mês do pagamento.
   O sistema cria sozinho, como "a pagar", toda conta fixa que vence até o fim do PRÓXIMO mês
   (nunca o ano inteiro). Respeita: vigência da conta, meses dispensados (excluídos) e datas da empresa.
   Contas atrasadas são recuperadas até 12 meses para trás. */
function autoRecurring(){
  var limit=nextMonth(currentMonth),oldest=addMonths(currentMonth+"-01",-12).slice(0,7),created=0;
  (db.recurring||[]).filter(r=>vf15LockGranted&&r.companyId===vf15LockedCompany?.id).forEach(function(r){
    if(r.active===false)return;
    var co=findBy(db.companies,r.companyId),c=r.startMonth||currentMonth;
    if(c<oldest)c=oldest;
    for(var guard=0;recDueMonth(r,c)<=limit&&guard<40;c=nextMonth(c),guard++){
      if(!recurringInRange(r,c)||(r.skip||[]).indexOf(c)>=0)continue;
      if(co.startDate&&c<co.startDate.slice(0,7))continue;
      if(co.endDate&&c>=co.endDate.slice(0,7))continue;
      if(db.expenses.some(function(e){return e.recurringId===r.id&&e.competence===c}))continue;
      pushRecurringExpense(r,c);created++
    }
  });
  return created
}
function monthsToCheck(){
  if(S.mode==="month")return [S.month];
  if(S.mode==="all")return [];
  var out=[],cy=Number(currentMonth.slice(0,4)),last=S.year===cy?Number(currentMonth.slice(5)):(S.year<cy?12:0);
  for(var i=1;i<=last;i++)out.push(S.year+"-"+pad(i));return out
}

/* Atalhos: Alt + letra abre a tela; Alt+M = "+ Novo" da tela atual; Esc fecha a janela aberta */
function onShortcut(e){
  var open=!$("modalRoot").classList.contains("hidden"),ovs=[].filter.call(document.querySelectorAll("body > div"),function(d){return d.querySelector("[data-ov]")});
  if(e.key==="Escape"){
    if(ovs.length){ovs[ovs.length-1].remove();e.preventDefault()}else if(open){closeModal();e.preventDefault()}
    return
  }
  if(!e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||!/^Key[A-Z]$/.test(e.code))return;
  var L=e.code.slice(3);
  if(L==="M"){ // "+ Novo" da tela atual
    if(open||ovs.length)return;
    var b=$("view-"+S.view).querySelector(".sectionTitle button.primary[data-act]");
    if(b){e.preventDefault();b.click()}
    return
  }
  var item=navItems.find(function(n){return n!=="-"&&n[3]===L});if(!item)return;
  e.preventDefault();
  if(open||ovs.length){if(!confirm("Há uma janela aberta. Fechar sem salvar e ir para "+item[2]+"?"))return;ovs.forEach(function(o){o.remove()});closeModal()}
  showView(item[0])
}
function renderNav(){
  var late=allTitles().filter(function(t){return isLate(t.p)}).length;

  }).join("")
}

  S.view=v;
  document.querySelectorAll("main section").forEach(function(s){s.classList.add("hidden")});

  for(var i=0;i<navItems.length;i++)if(navItems[i][0]===v){$("pageTitle").textContent=navItems[i][2];break}

/* ---------- Despesas (data de pagamento) ---------- */
function expRowStatus(ps,x){
  if(x.noExpenseThisMonth)return "Não tem no mês";
  if(ps.every(function(p){return p.status==="Pago"}))return "Pago";
  if(ps.some(isLate))return "Vencido";return "A pagar"
}
function expenseSort(a,b){
  var area=AREAS.indexOf(expArea(a))-AREAS.indexOf(expArea(b));
  if(area)return area;
  var ta=db.expenseTypes.findIndex(function(t){return t.id===a.expenseTypeId});
  var tb=db.expenseTypes.findIndex(function(t){return t.id===b.expenseTypeId});
  var rankA=Number.isFinite(a.expenseOrder)?a.expenseOrder:ta<0?db.expenseTypes.length:ta;
  var rankB=Number.isFinite(b.expenseOrder)?b.expenseOrder:tb<0?db.expenseTypes.length:tb;
  return rankA-rankB||(a.dueDate||a.date||"").localeCompare(b.dueDate||b.date||"")||a.id.localeCompare(b.id);
}
function moveExpense(id,targetId){
  var x=findBy(db.expenses,id),target=findBy(db.expenses,targetId);
  if(!x.id||!target.id||x.companyId!==cid()||target.companyId!==cid()||expArea(x)!==expArea(target))return;
  var group=byCompany(db.expenses).filter(function(row){return expArea(row)===expArea(x)}).sort(expenseSort);
  var from=group.indexOf(x),to=group.indexOf(target);
  group.splice(from,1);group.splice(to,0,x);
  group.forEach(function(row,i){row.expenseOrder=i});
  save()
}
function expenseArrows(list,i){
  var area=expArea(list[i].x),prev=list[i-1],next=list[i+1],prefix="moveExpense:"+list[i].x.id+":";

    (prev&&expArea(prev.x)===area?btn("",prefix+prev.x.id,"▲","Subir"):"")+
    (next&&expArea(next.x)===area?btn("",prefix+next.x.id,"▼","Descer"):"")+'</span>'
}

              var dd=new Date(iso+"T12:00:00");if(!iso||isNaN(dd)||Number(pp[1])>12||Number(pp[0])>31){alert("Data inválida. Use dd/mm/aaaa.");return false}
              if(tg.startDate&&iso<tg.startDate){alert("A data de inativação não pode ser anterior ao início no sistema ("+fmtDate(tg.startDate)+").");return false}
              tg.endDate=iso;tg.active=iso>TODAY;save()
            },null,480);
          break
        }
        tg.endDate="";tg.active=true;save();break
      }
      tg.active=tg.active===false;if(p[1]==="recurring"&&tg.active)autoRecurring();save();break;
    case "assetDispose":openAssetDisposal(p[1]);break;

/* exclusão: cadastros em uso só podem ser inativados */
function usage(kind,id){
  var any=function(tables,field){return tables.some(function(t){return (db[t]||[]).some(function(r){return r[field]===id})})};
  if(kind==="companies")return any(LAUNCH_TABLES.concat(["recurring"]),"companyId");
  if(kind==="counterparties")return any(["purchases","sales","expenses","payables","returns","recurring"],"partyId")||any(["assets"],"sellerId")||db.assets.some(function(a){return a.disposal&&a.disposal.buyerId===id});
  if(kind==="expenseTypes")return any(["expenses","recurring"],"expenseTypeId");
  if(kind==="documentTypes")return any(["purchases","sales","expenses"],"documentTypeId");
  if(kind==="assetGroups")return any(["assets"],"groupId");
  if(kind==="institutions")return any(["finance"],"institutionId");
  if(kind==="partners")return any(["profits"],"partnerId");
  return false
}
/* V22: a entrada do financiamento fica no próprio contrato (título "Entrada", pago na data do contrato).
   Uma versão de teste anterior criava uma despesa automática para a entrada (financeEntryId): ela é removida aqui. */
function migrateFinanceEntries(){var before=(db.expenses||[]).length;db.expenses=(db.expenses||[]).filter(function(e){return !e.financeEntryId});return db.expenses.length!==before}
function del(kind,id){
  if(usage(kind,id)){alert("Este cadastro já está em uso em lançamentos. Use “Inativar” — ele some das listas e o histórico é mantido.");return}
  if(kind==="companies"&&db.companies.length<=1){alert("É preciso manter ao menos uma empresa.");return}
  var x=findBy(db[kind],id),msg="Excluir este lançamento?";
  if(kind==="expenses"&&x.recurringId)msg="Excluir esta conta fixa de "+compLabel(x.competence)+"?\nEla não será lançada de novo neste mês (pode relançar pelo checklist).";
  else if(kind==="recurring")msg="Excluir esta conta fixa? As despesas já lançadas continuam.";
  else if((x.installments||[]).length>1)msg="Excluir o lançamento inteiro, com as "+x.installments.length+" parcelas?";
  if(!confirm(msg))return;
  if(kind==="expenses"&&x.recurringId){var r=findBy(db.recurring,x.recurringId);if(r.id){r.skip=r.skip||[];if(r.skip.indexOf(x.competence)<0)r.skip.push(x.competence)}}
  db[kind]=db[kind].filter(function(y){return y.id!==id});
  if(modalRefresh&&$("modalRoot").innerHTML&&kind!=="cashEntries")closeModal();
  save()
}
function wipe(kind){
  var txt=kind==="all"?"APAGAR TUDO: todos os dados e cadastros serão removidos e o sistema volta ao início.":"APAGAR LANÇAMENTOS de todas as empresas (os cadastros são mantidos).";
  if(!confirm(txt+"\n\nIsso não pode ser desfeito. Continuar?"))return;
  if(confirm("Deseja baixar um backup antes de apagar? (recomendado)"))exportBackup();
  var t=prompt("Para confirmar, digite APAGAR");
  if((t||"").trim().toUpperCase()!=="APAGAR"){alert("Nada foi apagado.");return}
  if(kind==="all"){db=clone(seed);OLDKEYS.forEach(function(k){try{localStorage.removeItem(k)}catch(e){}})}
  else{LAUNCH_TABLES.forEach(function(tb){db[tb]=[]});(db.recurring||[]).forEach(function(r){r.skip=[]})}
  S.f={};saveUi();closeModal();save();showView("dashboard");alert("Pronto! Sistema limpo.")
}

  n=Math.max(1,Number(n)||1);var cents=Math.round(Number(total||0)*100),base=Math.floor(cents/n),rem=cents-base*n,arr=[];
  for(var i=0;i<n;i++)arr.push((base+(i===n-1?rem:0))/100);return arr
}

function readInstallments(boxId,px,old){
  var arr=[];

function inferCond(x){

function wireCond(px,x,amountId){
  var st={list:clone(x.installments&&x.installments.length>1?x.installments:[])};
  function vis(){var c=get(px+"Cond");$("modalBody").querySelectorAll("[data-cond]").forEach(function(el){el.classList.toggle("hidden",el.getAttribute("data-cond")!==c)});
    $(px+"StPaidWrap").classList.toggle("hidden",c!=="prazo"||get(px+"St")!=="Pago")}
  function sumUp(){var s=0;st.list.forEach(function(p,i){s+=parseMoney(get(px+"PVal"+i))});var el=$(px+"PSum");if(el){var tot=parseMoney(get(amountId)),bad=Math.abs(s-tot)>0.009;el.innerHTML='<b class="'+(bad?"neg":"pos")+'">'+money(s)+'</b>'+(bad?' <small class="neg">≠ total '+money(tot)+'</small>':"")}}
  function render(){
    $(px+"Box").innerHTML=installmentEditor(st.list,px+"P");
    st.list.forEach(function(p,i){moneyMask(px+"PVal"+i);$(px+"PVal"+i).addEventListener("input",sumUp)});
    $(px+"Box").querySelectorAll("[data-remove-parcel]").forEach(function(b){b.onclick=function(){st.list=readInstallments(px+"Box",px+"P",st.list);st.list.splice(Number(b.getAttribute("data-remove-parcel")),1);render()}});
    sumUp()
  }
  render();vis();
  $(px+"Cond").onchange=vis;$(px+"St").onchange=vis;
  $(px+"Gen").onclick=function(){st.list=makeInstallments(parseMoney(get(amountId)),Number(get(px+"Count"))||1,get(px+"First")||get(px+"Due")||TODAY);render()};
  $(amountId).addEventListener("input",sumUp);
  return {
    build:function(amount,date){
      var c=get(px+"Cond"),old=x.installments||[],o=old.length===1?old[0]:{};
      if(c==="avista"){var pd=get(px+"Paid")||date;return {cond:c,dueDate:pd,list:[{id:o.id||uid(),number:1,dueDate:pd,amount:amount,status:"Pago",paidDate:pd,paidAmount:amount}]}}
      if(c==="prazo"){var due=get(px+"Due")||date,s=get(px+"St"),r={id:o.id||uid(),number:1,dueDate:due,amount:amount,status:s};
        if(s==="Pago"){r.paidDate=get(px+"StPaid")||due;r.paidAmount=(o.status==="Pago"&&o.paidAmount!=null&&o.amount===amount)?o.paidAmount:amount}
        return {cond:c,dueDate:due,list:[r]}}
      var list=$(px+"Box").querySelector("[data-parcel-row]")?readInstallments(px+"Box",px+"P",st.list):[];
      if(!list.length){alert("Clique em “Gerar parcelas” antes de salvar (ou escolha outra forma de pagamento).");return null}
      var s2=sum(list,function(p){return p.amount});
      if(Math.abs(s2-amount)>0.009&&!confirm("A soma das parcelas ("+money(s2)+") é diferente do valor total ("+money(amount)+"). Salvar assim mesmo?"))return null;
      return {cond:c,dueDate:list[0].dueDate,list:list}
    }
  }
}

function openAssetDisposal(id){
  var a=findBy(db.assets,id);if(!a.id)return;
  var d=a.disposal||{},isNew=a.status!=="Baixado";
  var reasons=["Venda","Sinistro / Perda total","Furto / Roubo","Doação","Obsolescência / Descarte","Outros"];
  var o=overlay((isNew?"Baixar bem — ":"Baixa do bem — ")+esc(a.description),
    '<p class="desc">Aquisição: <b>'+money(a.amount)+'</b> em '+fmtDate(a.date)+(a.groupName?" • "+esc(a.groupName):"")+'</p>'+
    '<div class="formGrid two">'+
    '<label>Data da baixa<input type="date" id="dpDate" value="'+esc(d.date||TODAY)+'"></label><label>Motivo<select id="dpReason">'+selOpts(reasons,d.reason||"Venda")+'</select></label>'+
    '<div class="fieldWithIcon" style="grid-column:1/-1"><label>Vendido para / destinatário<select id="dpBuyer">'+buyerOptions(d)+'</select></label><button class="iconBtn" id="dpBuyerPick" type="button" title="Consultar ou cadastrar">🔍</button></div>'+
    '<label>Valor da venda / indenização<input id="dpValue" value="'+(d.saleValue?brNumber(d.saleValue):"")+'" placeholder="0,00"></label><label>NF de venda / documento<input id="dpSaleDoc" value="'+esc(d.saleDoc||"")+'"></label>'+
    '<label>O valor entrou no caixa?<select id="dpCash"><option value="1">Sim</option><option value="0" '+(d.toCash===false?"selected":"")+'>Não</option></select></label><div></div>'+
    '</div><label style="font-size:12px;font-weight:700;display:block;margin-top:10px">Observações<textarea id="dpObs" style="width:100%">'+esc(d.obs||"")+'</textarea></label>',
    function(o){
      var dt=o.querySelector("#dpDate").value;if(!dt){alert("Informe a data da baixa.");return false}
      if(dt<a.date){alert("A data da baixa não pode ser anterior à aquisição.");return false}
      a.status="Baixado";
      var bv=o.querySelector("#dpBuyer").value,bp=findBy(db.counterparties,bv),legacy=bv==="__legacy";
      a.disposal={date:dt,reason:o.querySelector("#dpReason").value,buyerId:legacy?"":bv,buyer:legacy?d.buyer:(bp.name||""),buyerDoc:legacy?d.buyerDoc:(bp.doc||""),saleValue:parseMoney(o.querySelector("#dpValue").value),saleDoc:o.querySelector("#dpSaleDoc").value,toCash:o.querySelector("#dpCash").value==="1",obs:o.querySelector("#dpObs").value};
      closeModal();save()
    },
    function(o){moneyMask(o.querySelector("#dpValue"));
      o.querySelector("#dpBuyerPick").onclick=function(){openPartyPicker("Cliente","Para quem o bem foi vendido / destinado",function(nid){o.querySelector("#dpBuyer").innerHTML=buyerOptions({buyerId:nid})})}},720,
    isNew?"":'<button class="warning" data-ov="undo" style="margin-right:auto">↺ Reverter baixa (bem volta a ficar ativo)</button>');
  var u=o.querySelector("[data-ov=undo]");
  if(u)u.onclick=function(){if(!confirm("Reverter a baixa? O bem volta para a empresa e os dados da baixa serão apagados."))return;a.status="Ativo";delete a.disposal;o.remove();closeModal();save()}
}

function openStockSetup(){

  modal("Estoque inicial",
    '<div class="notice">Informe só no primeiro mês de uso (ou para acertar com um inventário). Nos meses seguintes o estoque é calculado automaticamente:<br><b>estoque anterior + compras × (1 + %Estoque) − vendas de mercadorias</b> (devoluções já descontadas).<br>O %Estoque é a margem colocada sobre as compras, porque as vendas estão a preço de venda. Ex.: 50% → R$ 1.000 de compra viram R$ 1.500 no estoque.</div>'+
    (so.source==="auto"?'<p class="subtle">Estoque calculado para '+compLabel(startComp)+': <b>'+money(so.amount)+'</b> (a partir de '+compLabel(so.base.competence)+').</p>':"")+

/* Tela de consulta: busca no cadastro de fornecedores/clientes, seleciona, ou cadastra um novo e já seleciona */
function openPartyPicker(kind,title,cb){
  var o=overlay(title,
    '<div class="filterBar" style="margin-top:0"><label style="flex:1">Buscar por nome ou CNPJ/CPF<input id="ppQ" style="width:100%" placeholder="Digite para filtrar..."></label><button class="secondary" type="button" id="ppNewBtn">+ Cadastrar novo</button></div>'+
    '<div id="ppNew" class="hidden" style="margin-bottom:12px"><div class="formGrid"><label>Nome / Razão social<input id="ppName"></label><label>CNPJ / CPF<input id="ppDoc" data-mask="doc" inputmode="numeric" placeholder="só números"></label><label>Tipo<select id="ppKind">'+selOpts(["Fornecedor","Cliente","Ambos"],kind)+'</select></label></div>'+
    '<div class="actions" style="margin-top:8px"><button class="primary" type="button" id="ppSaveNew">Cadastrar e selecionar</button></div></div>'+
    '<div id="ppList"></div>',
    function(){return true},null,760);
  o.querySelector("[data-ov=save]").classList.add("hidden");
  function pick(id){o.remove();cb(id)}
  function draw(){
    var q=o.querySelector("#ppQ").value.toLowerCase().trim(),qd=digits(q);
    var list=active(db.counterparties).filter(function(c){return !q||(c.name+" "+(c.doc||"")).toLowerCase().indexOf(q)>=0||(qd.length>=3&&digits(c.doc).indexOf(qd)>=0)}).sort(function(a,b){return (a.name||"").localeCompare(b.name||"")});
    o.querySelector("#ppList").innerHTML=tbl(["Nome","CNPJ/CPF","Tipo",""],list.map(function(c){return '<tr class="click" data-pp="'+c.id+'"><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.doc)+'</td><td>'+esc(c.kind)+'</td><td class="num"><button class="primary" type="button" data-pp="'+c.id+'">Selecionar</button></td></tr>'}),null,
      q?"Ninguém encontrado com “"+esc(q)+"”. Clique em “+ Cadastrar novo”.":"Nenhum cadastro ainda. Clique em “+ Cadastrar novo”.");
    o.querySelectorAll("tr[data-pp]").forEach(function(r){r.onclick=function(){pick(r.getAttribute("data-pp"))}})
  }
  o.querySelector("#ppQ").oninput=draw;
  o.querySelector("#ppNewBtn").onclick=function(){var b=o.querySelector("#ppNew");b.classList.toggle("hidden");o.querySelector("#ppName").value=o.querySelector("#ppQ").value;o.querySelector("#ppName").focus()};
  o.querySelector("#ppSaveNew").onclick=function(){
    var n=o.querySelector("#ppName").value.trim(),doc=o.querySelector("#ppDoc").value.trim();if(!n){alert("Informe o nome.");return}
    var dup=doc&&db.counterparties.find(function(c){return c.doc===doc});
    if(dup&&confirm("Já existe cadastro com este CNPJ/CPF: "+dup.name+". Selecionar esse?")){pick(dup.id);return}
    var r={id:uid(),name:n,kind:o.querySelector("#ppKind").value,doc:doc,contact:"",active:true};db.counterparties.push(r);persist();pick(r.id)
  };
  draw();setTimeout(function(){o.querySelector("#ppQ").focus()},40)
}

async function vf15ChooseCompany(){

/* Vital V14: camada de integração com cadastro único e totais mensais. */
function vfCode(v){return String(v==null?'':v).replace(/^0+(?=\d)/,'').trim()}
function vfMasterClients(){
  try {var f=JSON.parse(localStorage.getItem('vitalFiscalData')||'{}');return Array.isArray(f.clients)?f.clients:[]}catch(e){return []}
}
function vfMasterSync(){
  var clients=vfMasterClients();
  if(!clients.length)return false;
  var prev=JSON.stringify(db.companies),next=[];
  clients.forEach(function(c){
    if(!c.code)return;
    var existing=db.companies.find(function(x){return vfCode(x.code)===vfCode(c.code)})||{};
    // Preserve linked companyId to keep existing financial history.
    var id=existing.id||('vital-'+String(c.id||c.code).replace(/[^a-zA-Z0-9_-]/g,'_'));
    next.push(Object.assign({},existing,{id:id,code:String(c.code),name:String(c.name||''),doc:String(c.cnpj||c.doc||''),active:c.active!==false,startDate:c.startCompetence?c.startCompetence+'-01':(c.startDate||''),endDate:c.inactiveFrom?c.inactiveFrom+'-01':(c.endDate||c.inactiveDate||'')}));
  });
  // Keep historical company records with movements even when no longer in active master (read-only).
  db.companies.forEach(function(old){
    if(!next.some(function(c){return c.id===old.id})&&LAUNCH_TABLES.some(function(t){return (db[t]||[]).some(function(x){return x.companyId===old.id})})){
      next.push(Object.assign({},old,{active:false,legacy:true}));
    }
  });
  db.companies=next;
  return prev!==JSON.stringify(next)
}
function vfClosingRows(){
  try {var list=JSON.parse(localStorage.getItem('vitalFechamentoTeste')||'[]');return Array.isArray(list)?list:[]}catch(e){return []}
}
function vfAutoImported(r){return /^fechamento fiscal$/i.test(String(r.source||''))&&/^vf14\|/.test(String(r.syncKey||''))}
function vfAuthorizedStatus(st){return st==='Conferido'||st==='Conferido c/ apontamento'||st==='Sem movimento'}
var VF_FISCAL_DOCS=[
  ["nfe","NF-e","NFE"],["nfce","NFC-e","NFCE"],["nfse","NFS-e","NFSE"],
  ["cte","CT-e","CTE"],["cteos","CT-e OS","CTEOS"],["other","Outros","OUTROS"]
];
function vfCents(value){return Math.round((Number(value||0)+Number.EPSILON)*100)}
function vfDocId(type){
  var match=db.documentTypes.find(function(d){return d.name.toLowerCase().replace(/[^a-z0-9]/g,"")===type});
  return match?match.id:"vf-doc-"+type;
}
function vfSaleBreakdown(f,net){
  if(!net)return [];
  var docs=VF_FISCAL_DOCS.map(function(d){return {type:d[0],name:d[1],number:d[2],gross:vfCents(f[d[0]+"Revenue"])}});
  if(f.clientDocuments?.length)docs=docs.filter(function(d){return f.clientDocuments.includes(d.type)});
  docs=docs.filter(function(d){return d.gross>0});
  var gross=sum(docs,function(d){return d.gross});
  // Some older closings have only a consolidated total.
  if(!gross)return [{type:"",name:"Resumo fiscal mensal",number:"TOTAL-"+f.competence,cents:net}];
  // Use integer cents and cumulative rounding so the allocations add up to the fiscal net total.
  var running=0,assigned=0;
  docs.forEach(function(d){
    running+=d.gross;
    var target=Math.round(net*running/gross);
    d.cents=target-assigned;assigned=target;
  });
  return docs.filter(function(d){return d.cents>0});
}
function vfMovementEdited(old,next){
  var fields=["date","competence","partyId","documentTypeId","documentTypeName","documentNumber","description","amount","cond"];
  if(fields.some(function(k){return (old[k]??"")!==(next[k]??"")}))return true;
  var a=old.installments||[],b=next.installments||[];
  return a.length!==b.length||a.some(function(p,i){
    return ["amount","status","paidDate","dueDate","paidAmount"].some(function(k){return (p[k]??"")!==(b[i][k]??"")});
  });
}
function vfUnmodifiedImport(row,table,base){
  var ps=row.installments||[],p=ps[0]||{},sale=table==="sales",modern=row.importFiscalCents!=null;
  var date=base.split("|")[2]+"-01",due=modern?date:"";
  if(row.importEdited||row.date!==date||row.partyId||row.partyName||ps.length!==1||p.id!==row.syncKey+"|1"||
    (p.dueDate||"")!==due||vfCents(p.amount)!==vfCents(row.amount))return false;
  if(modern&&row.importFiscalCents!==vfCents(row.amount))return false;
  if(!modern){
    var legacyDescription=sale?"Faturamento líquido consolidado do Fechamento Fiscal":"Compras líquidas consolidadas do Fechamento Fiscal";
    if(row.documentNumber!=="TOTAL-"+base.split("|")[2]||row.documentTypeName!=="Resumo fiscal mensal"||row.description!==legacyDescription)return false;
  }
  if(modern&&sale)return row.cond==="avista"&&p.status==="Pago"&&p.paidDate===date&&vfCents(paidVal(p))===row.importFiscalCents;
  return row.cond==="prazo"&&p.status==="Em aberto"&&!p.paidDate;
}
function vfImportRow(co,f,table,key,doc,old){
  var sale=table==="sales",date=f.competence+"-01",amount=doc.cents/100;
  var name=doc.name||"Resumo fiscal mensal",docId=doc.type?vfDocId(doc.type):"";
  var parcel={id:key+"|1",number:1,dueDate:date,amount:amount,status:sale?"Pago":"Em aberto"};
  if(sale){parcel.paidDate=date;parcel.paidAmount=amount}
  return Object.assign({},old||{},{
    id:old?.id||key,syncKey:key,companyId:co.id,competence:f.competence,date:date,dueDate:date,
    amount:amount,source:"Fechamento Fiscal",documentNumber:"TOTAL-"+f.competence,documentTypeId:docId,
    documentTypeName:name,description:sale?(doc.type?"Faturamento líquido — "+name+" (Fechamento Fiscal)":"Faturamento líquido consolidado do Fechamento Fiscal"):"Compras líquidas consolidadas do Fechamento Fiscal",
    importDocKey:doc.type||"",importFiscalCents:doc.cents,cond:sale?"avista":"prazo",installments:[parcel]
  });
}
function vfSyncFiscalMonth(co,f,table,docs,stats){
  var base="vf14|"+co.id+"|"+f.competence+"|"+table;
  var existing=db[table].filter(function(r){return r.syncKey===base||String(r.syncKey||"").startsWith(base+"|")});
  var wanted=new Map(docs.map(function(d){return [d.type?base+"|"+d.type:base,d]}));
  var seen=new Set();
  // Check the full batch before touching a month. A paid or manually edited legacy total
  // cannot be safely split because its payment allocation by document is unknown.
  for(var old of existing){
    var next=wanted.get(old.syncKey),same=next&&old.importFiscalCents===next.cents;
    if(seen.has(old.syncKey)||(!same&&!vfUnmodifiedImport(old,table,base))){stats.blocked++;return false}
    seen.add(old.syncKey);
  }
  var changed=false;
  existing.forEach(function(old){
    if(!wanted.has(old.syncKey)){
      db[table].splice(db[table].indexOf(old),1);changed=true;stats.updated++;
    }
  });
  wanted.forEach(function(doc,key){
    var old=existing.find(function(r){return r.syncKey===key});
    if(old&&old.importFiscalCents===doc.cents){
      // Update only the generated V18 document number, preserving any manual number and payment edits.
      if(table==="sales"&&doc.type&&old.documentNumber===doc.number){
        old.documentNumber="TOTAL-"+f.competence;
        changed=true;stats.updated++;
      }else stats.unchanged++;
      return;
    }
    var rec=vfImportRow(co,f,table,key,doc,old);
    if(old)Object.assign(old,rec);else db[table].push(rec);
    changed=true;stats[old?"updated":"created"]++;
  });
  return changed;
}
function vfImportTotals(options){
  options=options||{};
  var clients=vfMasterClients(),closings=vfClosingRows(),stats={created:0,updated:0,unchanged:0,blocked:0,skipped:0};
  if(localStorage.getItem("vf14CaixaImportApproved")!=="1"||!clients.length)return stats;
  vfMasterSync();
  var changed=false;
  closings.forEach(function(f){
    var client=clients.find(function(c){return vfCode(c.code)===vfCode(f.clientCode)});
    if(!vf15LockGranted||!vf15LockedCompany||!client||vfCode(client.code)!==vfCode(vf15LockedCompany.code)){stats.skipped++;return}
    if(client.caixaIntegrationEnabled!==true||!/^\d{4}-(0[1-9]|1[0-2])$/.test(client.caixaIntegrationStart||"")||!f.competence||f.competence<client.caixaIntegrationStart){stats.skipped++;return}
    if(options.monthOnly&&f.competence!==options.monthOnly)return;
    if(!vfAuthorizedStatus(f.status)){stats.skipped++;return}
    var co=db.companies.find(function(c){return vfCode(c.code)===vfCode(client.code)});
    if(!co||co.id!==vf15LockedCompany.id||cid()!==co.id)return;
    var sale=f.noMovement?0:Math.max(0,vfCents(f.netRevenue));
    var buy=f.noMovement?0:Math.max(0,vfCents(f.entries)-vfCents(f.purchaseReturns));
    if(vfSyncFiscalMonth(co,f,"sales",vfSaleBreakdown(f,sale),stats))changed=true;
    if(vfSyncFiscalMonth(co,f,"purchases",buy?[{number:"TOTAL-"+f.competence,cents:buy}]:[],stats))changed=true;
  });
  if(changed){persist();fillCompanies();renderAll()}
  if(options.announce)alert("Integração do Fechamento Fiscal: "+stats.created+" incluído(s), "+stats.updated+" atualizado(s), "+stats.unchanged+" sem alteração e "+stats.blocked+" grupo(s) bloqueado(s)."+(stats.blocked?" Confira os totais antigos com pagamentos, edições ou duplicidade.":""));
  if(stats.blocked)console.warn("Vital Caixa: há importações que exigem conferência manual.",stats);
  return stats;
}
